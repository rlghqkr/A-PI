# A-PI 사전조사 매트릭스 — Google Gemini (작성: kimbong). 근거: 공식 문서 교차 검증 매트릭스(2026-10-19).
#   검증: uv run python -c "import yaml,json,jsonschema;d=yaml.safe_load(open('matrix/_parts/gemini.yaml'));jsonschema.validate(d,json.load(open('matrix/matrix_entry.schema.json')));print(len(d['entries']))"
#   GEMINI_API_KEY 가 없어 전부 evidence=docs. 키 발급 후 노트북으로 live 승격 예정.
author: kimbong
as_of: "2026-10-19"
entries:
  - provider: gemini
    item: models_list                # 모델 목록 조회
    availability: api
    endpoint: "GET https://generativelanguage.googleapis.com/v1beta/models ; GET https://generativelanguage.googleapis.com/v1beta/models/{model}"
    auth: standard_key
    sdk_call: "client.models.list()  /  client.models.get(model='gemini-3.8-flash')"
    response_fields:
      - name
      - baseModelId
      - version
      - displayName
      - inputTokenLimit
      - outputTokenLimit
      - supportedGenerationMethods
      - thinking
      - temperature
      - nextPageToken
    common_fields:
      - model_id
      - context_window
      - max_output_tokens
    caveats: >-
      3사 중 메타데이터가 가장 풍부(컨텍스트·출력 한도, thinking 지원, 지원 메서드)하지만 가격·지식 컷오프·deprecation 날짜는 없음.
      SDK 속성은 snake_case 이며 supportedGenerationMethods 는 supported_actions 로 노출(속성명 세부 confidence 0.75).
      2.5 세대는 deprecated 가 아니어도 '과거 사용자만 접근 가능'이라 목록에 보여도 신규 프로젝트에서 호출이 거부될 수 있음 → 3.5 Flash-Lite / 3.8 Flash 권장.
      pageSize 기본 50, 최대 1000, pageToken 페이지네이션.
    evidence: docs
    blocked_reason: ""
    sources:
      - https://ai.google.dev/api/models
      - https://github.com/googleapis/python-genai
      - https://ai.google.dev/gemini-api/docs/models
      - https://ai.google.dev/gemini-api/docs/deprecations
    confidence: 0.95

  - provider: gemini
    item: generate                   # 모델 호출
    availability: api
    endpoint: "POST https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent (유지) ; POST https://generativelanguage.googleapis.com/v1beta/interactions (권장) ; 스트리밍 :streamGenerateContent / interactions stream=true"
    auth: standard_key
    sdk_call: "client.models.generate_content(model='gemini-3.8-flash', contents='...').text  /  client.interactions.create(model=, input=).output_text"
    response_fields:
      - candidates[].content.parts[].text
      - candidates[].finishReason
      - promptFeedback
      - usageMetadata
      - modelVersion
      - responseId
      - id
      - status
      - output_text
      - usage
    common_fields:
      - model_id
      - text
      - finish_reason
      - input_tokens
      - output_tokens
      - latency
      - request_id
      - http_status
    caveats: >-
      호출 API 가 2개 공존: generateContent 는 'remains fully supported' 이지만 신규 개발은 Interactions API 권장(Quickstart·text-generation 문서는 Interactions 만 다룸;
      'Generate Content API (Legacy)' 섹션은 Quickstart 에 존재하지 않음 — CORRECTED). 두 API 의 usage 필드명이 다르므로(promptTokenCount/candidatesTokenCount vs total_input_tokens/total_output_tokens) 어댑터 정규화 필수.
      Gemini 4 및 3.6+ 모델은 temperature/top_p/top_k 를 무시하고 deprecation warning 헤더를 반환 → 3사 동일 샘플링 조건 비교가 불가능한 모델 존재.
      Interactions 는 기본 store=true(서버 저장) → 불필요하면 store=False. 기본 API 버전은 v1beta.
    evidence: docs
    blocked_reason: ""
    sources:
      - https://ai.google.dev/api/generate-content
      - https://ai.google.dev/gemini-api/docs/interactions
      - https://ai.google.dev/api/interactions
      - https://ai.google.dev/gemini-api/docs/text-generation
    confidence: 0.95

  - provider: gemini
    item: token_usage                # Token Usage
    availability: api
    endpoint: "응답 내 usageMetadata (…:generateContent) ; interaction.usage (…/v1beta/interactions) ; 사전 카운트 POST https://generativelanguage.googleapis.com/v1beta/models/{model}:countTokens"
    auth: standard_key
    sdk_call: "resp.usage_metadata.prompt_token_count / candidates_token_count / thoughts_token_count / total_token_count ; client.models.count_tokens(model=, contents=).total_tokens"
    response_fields:
      - promptTokenCount
      - candidatesTokenCount
      - thoughtsTokenCount
      - cachedContentTokenCount
      - toolUsePromptTokenCount
      - totalTokenCount
      - promptTokensDetails[]
      - total_input_tokens
      - total_output_tokens
      - total_thought_tokens
    common_fields:
      - input_tokens
      - output_tokens
      - total_tokens
      - cached_input_tokens
      - reasoning_tokens
    caveats: >-
      thinking 토큰은 thoughtsTokenCount(generateContent) / total_thought_tokens(Interactions) 로 분리 노출되지만 과금은 출력 단가로 합산 → 과금 관점 output = candidates + thoughts.
      totalTokenCount = prompt + toolUsePrompt + thoughts + candidates 로 정의되어 candidates 와 thoughts 는 이중 계산이 아님(단, Gemini API vs Vertex 에서 candidatesTokenCount 에 thinking 포함 여부가 다르다는 비공식 이슈가 있어 실측 확인 필요).
      countTokens 는 과금되지 않음('GetTokens requests are not billed'). SDK CountTokensResponse 는 total_tokens, cached_content_token_count 만 노출(모달리티별 분해는 REST 직접 호출).
    evidence: docs
    blocked_reason: ""
    sources:
      - https://ai.google.dev/api/generate-content
      - https://ai.google.dev/api/tokens
      - https://ai.google.dev/gemini-api/docs/tokens
      - https://ai.google.dev/gemini-api/docs/thinking
    confidence: 0.95

  - provider: gemini
    item: usage_report               # Usage 조회
    availability: dashboard_only
    endpoint: "없음(대시보드: https://aistudio.google.com/usage). 간접: GET https://monitoring.googleapis.com/v3/projects/{project}/timeSeries (Cloud Monitoring, OAuth) ; BigQuery billing export 테이블 쿼리"
    auth: login_only
    sdk_call: "(Gemini API 키로는 불가) monitoring_v3.MetricServiceClient().list_time_series(name=f'projects/{PROJECT}', filter='metric.type=\"generativelanguage.googleapis.com/generate_content_usage_output_token_count\"', ...)"
    response_fields:
      - timeSeries[].points[].interval
      - timeSeries[].points[].value
      - metric.labels.model
      - metric.labels.output_modality
      - metric.labels.thinking_enabled
      - metric.labels.response_code
      - usage.amount_in_pricing_units
      - usage.pricing_unit
      - cost
      - sku.description
    common_fields:
      - input_tokens
      - output_tokens
      - requests
    caveats: >-
      Gemini API 자체에는 기간별 사용량 집계 엔드포인트가 없음(OpenAI Admin Usage / Anthropic Usage Admin API 와의 가장 큰 차이). API 가 없는 것은 사실이므로 BLOCKED 가 아니라 dashboard_only.
      간접 수단은 모두 Google Cloud OAuth2(ADC/서비스계정, oauth_cloud) 필요: Cloud Monitoring 에 Gemini 전용 토큰 메트릭 generate_content_usage_output_token_count(BETA, labels model/output_modality/thinking_enabled)와 quota/generate_content_*_input_token_count 가 있어 모델별·기간별 집계가 가능하고, BigQuery billing export 는 Paid tier + 사전 활성화 필수(비용 데이터 최대 24h 지연).
      단, Auth key(2026-05-28 이후 신규 키 기본)로 보낸 요청은 '서비스 계정 usage metrics 에 기록되지 않음' → Cloud 측 메트릭 반영 범위 미확인(open question). Simulator 는 호출별 usage_metadata 를 자체 적재해 집계하는 것이 유일한 3사 공통 경로.
    evidence: docs
    blocked_reason: ""
    sources:
      - https://ai.google.dev/gemini-api/docs/billing
      - https://ai.google.dev/gemini-api/docs/rate-limits
      - https://docs.cloud.google.com/monitoring/api/metrics_gcp_d_h
      - https://docs.cloud.google.com/monitoring/api/ref_v3/rest/v3/projects.timeSeries/list
    confidence: 0.85

  - provider: gemini
    item: cost                       # 비용 확인
    availability: partial
    endpoint: "비용 엔드포인트 없음(로컬 계산). 단가표: https://ai.google.dev/gemini-api/docs/pricing ; (간접) GET https://cloudbilling.googleapis.com/v2beta/skus , GET https://cloudbilling.googleapis.com/v1beta/skus/{SKU_ID}/prices"
    auth: none
    sdk_call: "cost_usd = ((prompt - cached) * p_in + cached * p_cache + (candidates + thoughts) * p_out) / 1e6   # 단가는 pricing 페이지 수동 입력"
    response_fields:
      - skus[].name
      - skus[].displayName
      - skus[].service
      - prices[].rate.tiers[].startAmount
      - prices[].rate.tiers[].listPrice.units
      - prices[].rate.tiers[].listPrice.nanos
      - prices[].unitInfo.unit
    common_fields:
      - cost_usd
      - input_tokens
      - output_tokens
      - model_id
    caveats: >-
      3사 모두 단가는 API 로 미제공 → 토큰 × 공식 단가(USD/1M) 로컬 계산. 로컬 계산 자체는 인증 불필요(auth=none), 실제 청구액 열람(Cloud Billing 리포트·BigQuery export)은 결제계정 OAuth 권한 + Paid tier 가 필요해 partial.
      출력 단가는 thinking 토큰 포함, 입력 단가 대상 = (promptTokenCount − cachedContentTokenCount) + toolUsePromptTokenCount, 캐시 읽기 ≈ 입력 단가 10% + 시간당 저장료. 2.5 Pro / 3.1 Pro 는 200k 프롬프트 기준 2단 요금, Batch/Flex 50%, Priority 1.8배.
      가격 인상이 날짜별로 예고됨(gemini-4-argon 2026-12-01 $4/$20, 3.8/3.6 Flash 2027-01-01 $1.50/$7.50) → 단가표에 '적용일' 컬럼 필요. Cloud Billing Pricing API 의 공개 SKU 그룹 'Gen AI Gemini Models' 는 전부 Vertex AI 소속이라 Gemini Developer API 단가와 혼동 금지(노출 여부 미검증).
    evidence: docs
    blocked_reason: ""
    sources:
      - https://ai.google.dev/gemini-api/docs/pricing
      - https://ai.google.dev/gemini-api/docs/billing
      - https://docs.cloud.google.com/billing/docs/how-to/get-pricing-information-api
      - https://docs.cloud.google.com/billing/docs/how-to/export-data-bigquery
    confidence: 0.85

  - provider: gemini
    item: status_errors              # 상태 및 오류 확인
    availability: api
    endpoint: "헬스체크 GET https://generativelanguage.googleapis.com/v1beta/models/{model} (또는 POST …:countTokens) ; 오류는 모든 엔드포인트의 HTTP status + {\"error\":{\"code\",\"message\"}} 바디"
    auth: standard_key
    sdk_call: "try: client.models.get(model='gemini-3.8-flash') except errors.ClientError as e: e.code, e.message, e.status  # 4xx ; errors.ServerError = 5xx"
    response_fields:
      - http_status
      - error.code
      - error.message
      - error.status
      - error.details[]
      - e.code
      - e.message
      - e.status
      - e.details
    common_fields:
      - http_status
      - error_type
      - error_code
      - error_message
      - latency
    caveats: >-
      error.code 는 snake_case 문자열(rate_limit_exceeded, quota_exceeded, model_not_found, payment_required …)이고 gRPC 이름(RESOURCE_EXHAUSTED 등)이 error.status / SDK APIError.status 에 병존 → 둘 다 기록. 표에 없는 코드는 HTTP status 의 snake_case 로 폴백하므로 화이트리스트가 아닌 패턴 매칭으로 처리.
      선불 잔액 소진은 402 payment_required 가 별도로 존재. Retry-After / x-ratelimit-* 류 레이트리밋 응답 헤더는 공식 문서에 없음(429 바디 retryDelay 는 비공식 보고만). 한도는 프로젝트 단위(RPM/TPM/RPD + Paid tier 10분 롤링 지출 한도 $10/$50/$200) 초과 시 429 RESOURCE_EXHAUSTED.
      CORRECTED: troubleshooting 문서는 '기본 4회 자동 재시도'라 쓰지만 google-genai 2.31.0 소스는 HttpOptions.retry_options=None → stop_after_attempt(1) 로 재시도 없음이 기본. 재시도를 원하면 HttpRetryOptions() 를 명시(기본 attempts=5, 초기 호출 포함). timeout 단위는 밀리초.
      uncertain: models.get 이 '토큰 소비/과금 없음'이라는 공식 문장은 없음(메타데이터 조회 성격상 타당). countTokens 가 과금되지 않는 점은 billing 문서로 확인. models.get 은 429 경로를 검증하지 못함.
    evidence: docs
    blocked_reason: ""
    sources:
      - https://ai.google.dev/gemini-api/docs/api-errors
      - https://ai.google.dev/gemini-api/docs/troubleshooting
      - https://ai.google.dev/gemini-api/docs/rate-limits
      - https://github.com/googleapis/python-genai/blob/main/google/genai/errors.py
    confidence: 0.9

  - provider: gemini
    item: example                    # 호출 예제
    availability: api
    endpoint: "POST https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent ; POST https://generativelanguage.googleapis.com/v1beta/interactions ; (OpenAI 호환) https://generativelanguage.googleapis.com/v1beta/openai/"
    auth: standard_key
    sdk_call: "from google import genai; client = genai.Client(); client.models.generate_content(model='gemini-3.8-flash', contents='...').text"
    response_fields:
      - resp.text
      - resp.candidates[0].finish_reason
      - resp.usage_metadata.prompt_token_count
      - resp.usage_metadata.candidates_token_count
      - resp.usage_metadata.total_token_count
      - resp.model_version
      - resp.response_id
      - interaction.output_text
      - interaction.id
      - interaction.usage
    common_fields:
      - model_id
      - text
      - input_tokens
      - output_tokens
      - request_id
    caveats: >-
      pip install -U google-genai(README 권고: '< 3.0.0' 핀) → GEMINI_API_KEY(또는 GOOGLE_API_KEY; 둘 다 있으면 GOOGLE_API_KEY 우선) → genai.Client(). REST 는 x-goog-api-key 헤더(Bearer 아님).
      CORRECTED: Quickstart 에 'Generate Content API (Legacy)' 섹션은 없음. Quickstart·text-generation·tokens 가이드는 모두 Interactions API 만 다루고, 'generateContent 는 fully supported 지만 신규 개발은 Interactions 권장' 서술은 interactions / migrate-to-interactions 문서에 있음. Interactions 는 google-genai >= 2.3.0 필요(2.31.0 충족).
      레거시 import google.generativeai 는 2025-11-30 deprecated → 사용 금지. Vertex AI('Gemini Enterprise Agent Platform')는 genai.Client(vertexai=True, project=, location=) + ADC/OAuth, aiplatform.googleapis.com 호스트, 결제 활성화 필수로 API 키 흐름과 다름 → PoC 는 AI Studio 키 경로.
    evidence: docs
    blocked_reason: ""
    sources:
      - https://ai.google.dev/gemini-api/docs/quickstart
      - https://ai.google.dev/gemini-api/docs/migrate
      - https://github.com/googleapis/python-genai
      - https://ai.google.dev/gemini-api/docs/openai
    confidence: 0.9
