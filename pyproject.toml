[project]
name = "apicompare"
version = "0.1.0"
description = "A-PI 사전조사: OpenAI / Anthropic Claude / Google Gemini API 구조 비교 도구 (Multi-LLM Simulator Provider 어댑터 초안)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3,<4",
    "anthropic>=1,<2",
    "google-genai>=2.3,<3",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "pyyaml>=6",
    "jsonschema>=4",
    "pandas>=2.2",
    "tabulate>=0.9",
]

[dependency-groups]
dev = [
    "jupyterlab>=4",
    "ipykernel>=6",
    "nbformat>=5",
    "nbconvert>=7",
    "nbstripout>=0.8",
    "jupytext>=1.16",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apicompare"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
